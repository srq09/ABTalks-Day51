name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Test ML Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Model
        run: |
          python train_model.py

      - name: Verify Model File
        run: |
          test -f model/model.pkl
          echo "Model file created successfully."

      - name: Test FastAPI Application
        run: |
          python -c "from app import app; print('FastAPI application loaded successfully.')"

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Model
        run: |
          python train_model.py

      - name: Build Docker Image
        run: |
          docker build -t mlops-model-api:latest .

      - name: Run Docker Container
        run: |
          docker run -d --name mlops-api -p 8000:8000 mlops-model-api:latest

      - name: Wait for Application
        run: |
          sleep 10

      - name: Health Check
        run: |
          curl --fail http://localhost:8000/health

      - name: Stop Docker Container
        if: always()
        run: |
          docker stop mlops-api || true
          docker rm mlops-api || true